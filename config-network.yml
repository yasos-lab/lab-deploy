---

- name: Deploy network
  hosts: network
  become: true
  handlers:
    - import_tasks: tasks/handlers/main.yml
  tasks:
    - name: Import packages tasks
      ansible.builtin.import_tasks: tasks/common/packages.yml
      tags: network::packages
    
    - name: Import shell tasks
      ansible.builtin.import_tasks: tasks/common/shell.yml
      tags: server::shell

    - name: Configure and deploy Unbound
      ansible.builtin.import_tasks: tasks/network/unbound.yml
      tags: network::unbound

    - name: Configure and deploy PiHole
      ansible.builtin.import_tasks: tasks/network/pihole.yml
      tags: network::pihole

    - name: Configure and deploy PiVPN
      ansible.builtin.import_tasks: tasks/network/pivpn.yml
      tags: network::pivpn
    
    - name: Configure and deploy glance agent
      ansible.builtin.import_tasks: tasks/common/glance-agent.yml
      tags: network::glance

    - name: Configure and deploy monitoring tools (node explorer for prometheus & promtail for loki)
      ansible.builtin.import_tasks: tasks/common/monitoring.yml
      tags: network::monitoring
    