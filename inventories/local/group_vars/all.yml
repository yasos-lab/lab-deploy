---

##### REPO:START #####
repositories: "{{ base_repositories + extra_repositories }}"
##### REPO:END #####

##### PKG:START #####
packages: "{{ utils_packages + base_packages + extra_packages }}"

utils_packages:
  - curl
  - git
  - jq
  - lsb-release
  - openssl
  - unzip
  - vim
  - wget
##### PKG:END #####

##### DIR:START #####
backup_directory: "{{ user_home }}/Backups"

config_files:
  - file: .vimrc
    dest_path: "{{ user_home }}"
    mode: '0644'
  - file: .secrets
    dest_path: "{{ user_home }}"
    mode: '0600'
  - file: .zshrc
    dest_path: "{{ user_home }}"
    mode: '0644'
  - file: .p10k.zsh
    dest_path: "{{ zsh_directory }}"
    mode: '0644'

directories:
  - "{{ user_home }}/OS"
  - "{{ user_home }}/VMs"
  - "{{ user_home }}/Family"
  - "{{ user_home }}/Friends"
  - "{{ user_home }}/Gallery"
  - "{{ user_home }}/OnlineCourses"
  - "{{ documents_directory }}"
  - "{{ documents_directory }}/Tmp"
  - "{{ documents_directory }}/ApkApps"
  - "{{ documents_directory }}/Invoices"
  - "{{ backup_directory }}"
  - "{{ backup_directory }}/Accounts"
  - "{{ backup_directory }}/Accounts/SocialMedia"
  - "{{ backup_directory }}/Accounts/Email"
  - "{{ backup_directory }}/Websites"
  - "{{ backup_directory }}/Apps"
  - "{{ backup_directory }}/Apps/Whatsapp"
  - "{{ zsh_directory }}"

documents_directory: "{{ user_home }}/Documents"

user_home: "/home/{{ ansible_user }}"
##### DIR:END #####

##### DKR:START #####
docker_containers: "{{ base_docker_containers + extra_docker_containers }}"

docker_networks: "{{ base_docker_networks + extra_docker_networks }}"

docker_packages:
  - docker-ce 
  - docker-ce-cli
  - containerd.io 
  - docker-compose
  - docker-buildx-plugin 
  - docker-compose-plugin
  
docker_volumes: "{{ base_docker_volumes + extra_docker_volumes }}"
##### DKR:END #####

##### PRG:START #####
purge_vars:
  docker: no
  packages: no
  repositories: no
  shell: no
  services: no
  syncthing: no
##### PRG:END #####

##### SVC:START #####
base_services:
  - name: "syncthing"
    description: "SyncThing - Open Source Continuous File Synchronization"
    exec_start: "/usr/bin/syncthing -no-browser -home=/home/{{ ansible_user }}/.config/syncthing"
    restart_policy: "on-failure"
    restart_delay: 5
    after: "network-online.target"
    user: "{{ ansible_user }}"

systemd_services: "{{ base_services + extra_services }}"
##### SVC:END #####


##### ZSH:START #####
zsh_directory: "{{ user_home }}/.zsh"

zsh_packages:
  - zsh

zsh_repositories:
  - repo: https://github.com/romkatv/powerlevel10k.git
    dest: "{{ zsh_directory }}/powerlevel10k"
    depth: 1
  - repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    dest: "{{ zsh_directory }}/plugins/zsh-syntax-highlighting"
    depth: 0
  - repo: https://github.com/zsh-users/zsh-autosuggestions
    dest: "{{ zsh_directory }}/plugins/zsh-autosuggestions"
    depth: 0
##### ZSH:END #####