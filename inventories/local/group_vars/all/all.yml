---


base_packages:
  - apt-transport-https
  - build-essential
  - ca-certificates
  - coreutils
  - curl
  - git
  - gnupg2
  - jq
  - lsb-release
  - openssl
  - software-properties-common
  - syncthing
  - unzip
  - vim
  - wget
  - zsh

base_repositories:
  - name: "docker"
    repo_url: "https://download.docker.com/linux/debian"
    gpg_url: "https://download.docker.com/linux/debian/gpg"
    gpg_extention: "asc"
    components:
      - "{{ ansible_lsb.codename }}"
      - "stable"

  - name: "syncthing"
    repo_url: "https://apt.syncthing.net"
    gpg_url: "https://syncthing.net/release-key.gpg"
    gpg_extention: "gpg"
    components:
      - "syncthing"
      - "stable"
  
config_files:
  - file: .vimrc
    dest_path: "{{ user_home }}"
    mode: '0644'
  - file: .secrets
    dest_path: "{{ user_home }}"
    mode: '0600'
  - file: .zshrc
    dest_path: "{{ user_home }}"
    mode: '0644'
  - file: .p10k.zsh
    dest_path: "{{ zsh_directory }}"
    mode: '0644'



docker_packages:
  - docker-ce 
  - docker-ce-cli
  - containerd.io 
  - docker-compose
  - docker-buildx-plugin 
  - docker-compose-plugin


purge_vars:
  docker: no
  packages: no
  repositories: no
  shell: no
  services: no
  syncthing: no

systemd_services:
  - name: "syncthing"
    description: "SyncThing - Open Source Continuous File Synchronization"
    exec_start: "/usr/bin/syncthing -no-browser -home=/home/{{ ansible_user }}/.config/syncthing"
    restart_policy: "on-failure"
    restart_delay: 5
    after: "network-online.target"
    user: "{{ ansible_user }}"

zsh_repositories:
  - repo: https://github.com/romkatv/powerlevel10k.git
    dest: "{{ zsh_directory }}/powerlevel10k"
    depth: 1
  - repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    dest: "{{ zsh_directory }}/plugins/zsh-syntax-highlighting"
    depth: 0
  - repo: https://github.com/zsh-users/zsh-autosuggestions
    dest: "{{ zsh_directory }}/plugins/zsh-autosuggestions"
    depth: 0