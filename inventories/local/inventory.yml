---

all:
  hosts:
    ubuntu_laptop:
      ansible_host: localhost
      ansible_user: "{{ lookup('env', 'USER') }}"
      ansible_become_password: "{{ lookup('env', 'PASSWORD') }}"
    fedora_laptop:
      ansible_host: 192.168.122.20
      ansible_user: "{{ lookup('env', 'USER') }}"
      ansible_become_password: "{{ lookup('env', 'PASSWORD') }}"
    raspberry1:
      ansible_host: 192.168.122.10
      ansible_user: "{{ lookup('env', 'USER') }}"
      ansible_become_password: "{{ lookup('env', 'PI_PASSWORD') }}"
    debian_server:
      ansible_host: 192.168.122.121
      ansible_user: "{{ lookup('env', 'USER') }}"
      ansible_become_password: "{{ lookup('env', 'SERVER_PASSWORD') }}"

  children:
    linux:
      hosts:
        ubuntu_laptop:
        fedora_laptop:
        debian_server:
        raspberry1:
    debian:
      hosts:
        ubuntu_laptop:
        debian_server:
        raspberry1:
    laptops:
      hosts:
        ubuntu_laptop:
        fedora_laptop:
    servers:
      hosts:
        debian_server:
    pis:
      hosts:
        raspberry1: