---

all:
  hosts:
    ubuntu_thinkpad:
      ansible_host: localhost
      ansible_user: "{{ lookup('env', 'TP_USER') }}"
      ansible_become_password: "{{ lookup('env', 'TP_PASSWORD') }}"
    debian_thinkcenter:
      ansible_host: 192.168.122.121
      ansible_user: "{{ lookup('env', 'SVR_USER') }}"
      ansible_become_password: "{{ lookup('env', 'SVR_PASSWORD') }}"
    raspberry_pi_1:
      ansible_host: 192.168.122.10
      ansible_user: "{{ lookup('env', 'PI_USER') }}"
      ansible_become_password: "{{ lookup('env', 'PI_PASSWORD') }}"

  children:
    debian:
      children:
        debian_workstations:
          hosts:
            ubuntu_thinkpad:
        debian_servers:
          hosts:
            debian_thinkcenter:
        raspberries:
          hosts:
            raspberry_pi_1: