---

all:
  hosts:
    ubuntu_thinkpad:
      ansible_host: localhost
      ansible_user: "{{ lookup('env', 'TP_LT_USER') }}"
      ansible_become_password: "{{ lookup('env', 'TP_LT_PASSWORD') }}"
    debian_thinkcenter:
      ansible_host: 192.168.122.121
      ansible_user: "{{ lookup('env', 'TC_SVR_USER') }}"
      ansible_become_password: "{{ lookup('env', 'TC_SVR_PASSWORD') }}"
    raspberry_pi_1:
      ansible_host: 192.168.1.30
      ansible_user: "{{ lookup('env', 'PI_1_USER') }}"
      ansible_become_password: "{{ lookup('env', 'PI_1_PASSWORD') }}"

  children:
    controllers:
      hosts:
        ubuntu_thinkpad:
    debian:
      children:
        debian_workstations:
          hosts:
            ubuntu_thinkpad:
        debian_servers:
          hosts:
            debian_thinkcenter:
        raspberries:
          hosts:
            raspberry_pi_1: