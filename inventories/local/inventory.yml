---

all:
  hosts:
    ubuntu_thinkpad:
      ansible_host: 192.168.1.10
      ansible_user: "{{ lookup('env', 'TP_USER') }}"
      ansible_become_password: "{{ lookup('env', 'TP_PASSWORD') }}"
    debian_thinkcenter:
      ansible_host: 192.168.1.20
      ansible_user: "{{ lookup('env', 'TC_USER') }}"
      ansible_become_password: "{{ lookup('env', 'TC_PASSWORD') }}"
    raspberry_pi_1:
      ansible_host: 192.168.1.30
      ansible_user: "{{ lookup('env', 'PI_1_USER') }}"
      ansible_become_password: "{{ lookup('env', 'PI_1_PASSWORD') }}"

  children:
    workstations:
      hosts:
        ubuntu_thinkpad:
    servers:
      hosts:
        debian_thinkcenter:
    raspberries:
      hosts:
        raspberry_pi_1: