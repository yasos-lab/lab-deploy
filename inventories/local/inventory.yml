---

all:
  hosts:
    ubuntu-thinkpad:
      ansible_host: localhost
      ansible_user: "{{ lookup('env', 'LOCAL_USER') }}"
      ansible_become_password: "{{ lookup('env', 'LOCAL_PASSWORD') }}"
    fedora-elitebook:
      ansible_host: 192.168.1.161
      ansible_user: "{{ lookup('env', 'LOCAL_USER') }}"
      ansible_become_password: "{{ lookup('env', 'LOCAL_PASSWORD') }}"
    raspberry-pi-1:
      ansible_host: 192.168.122.10
      ansible_user: "{{ lookup('env', 'PI_USER') }}"
      ansible_become_password: "{{ lookup('env', 'PI_PASSWORD') }}"
    debian-thinkcenter:
      ansible_host: 192.168.122.121
      ansible_user: "{{ lookup('env', 'SERVER_USER') }}"
      ansible_become_password: "{{ lookup('env', 'SERVER_PASSWORD') }}"

  children:
    linux:
      children:
        redhat:
          children:
            redhat-servers:
            redhat-laptops:
              hosts:
                fedora-elitebook:
        debian:
          hosts:
            ubuntu-thinkpad:
          children:
            debian-servers:
              hosts:
                debian-thinkcenter:
            debian-laptops:
              hosts:
                ubuntu-thinkpad:
            raspberries:
              hosts:
                raspberry-pi-1: