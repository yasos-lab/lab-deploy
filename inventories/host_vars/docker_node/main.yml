---

media_mount: "/mnt/media"

deb_packages:
  - "{{ rclone_package_deb }}"

directories:
  - "{{ backup_mount }}"
  - "{{ media_mount }}/library/books"
  - "{{ media_mount }}/library/courses"
  - "{{ media_mount }}/library/movies"
  - "{{ media_mount }}/library/music"
  - "{{ media_mount }}/library/other"
  - "{{ media_mount }}/library/quran"
  - "{{ media_mount }}/library/tv"
  - "{{ media_mount }}/torrents"

disks_fs:
  - device: "docker_backup"
    mount_point: "{{ backup_mount }}"
    fstype: "virtiofs"
  - device: "media"
    mount_point: "/mnt/media"
    fstype: "virtiofs"
  - device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1"
    mount_point: "{{ docker_services_directory }}"
    fstype: "ext4"

docker_networks:
  - frontend
  - backend

docker_plugins:
  - name: "grafana/loki-docker-driver:3.4.3-{{ arch }}"
    alias: "loki"

docker_services:
  - stack_name: "00-network"
    services:
      - "authelia"
      - "traefik"
      - "whoami"
      - "cloudflare-ddns"
      - "speedtest"
    templates:
      - src: "docker/00-network/config/traefik/traefik.yml.j2"
        dest: "{{ docker_services_directory }}/00-network/config/traefik/traefik.yml"
      - src: "docker/00-network/config/authelia/users_database.yml.j2"
        dest: "{{ docker_services_directory }}/00-network/config/authelia/users_database.yml"
      - src: "docker/00-network/config/authelia/configuration.yml.j2"
        dest: "{{ docker_services_directory }}/00-network/config/authelia/configuration.yml"
    configs: []
    crons: []
  - stack_name: "01-core"
    services:
      # - "vaultwarden"
      # - "rustfs"
      - "redis"
    configs: []
    templates: []
    crons: []
  - stack_name: "02-monitoring"
    services:
      - "grafana"
      - "prometheus"
      - "loki"
      - "cadvisor"
      - "node_exporter"
      - "promtail"
      - "glance"
      - "uptime-kuma"
    templates:
      - src: "docker/02-monitoring/config/glance/glance.yml.j2"
        dest: "{{ docker_services_directory }}/02-monitoring/config/glance/glance.yml"
      - src: "docker/02-monitoring/config/prometheus/prometheus.yml.j2"
        dest: "{{ docker_services_directory }}/02-monitoring/config/prometheus/prometheus.yml"
      - src: "docker/02-monitoring/config/loki/loki-config.yml.j2"
        dest: "{{ docker_services_directory }}/02-monitoring/config/loki/loki-config.yml"
      - src: "docker/02-monitoring/config/promtail/promtail-config.yml.j2"
        dest: "{{ docker_services_directory }}/02-monitoring/config/promtail/promtail-config.yml"
    configs:
      - src: "common/glance/widgets/jellyfin-playing.yml"
        dest: "{{ docker_services_directory }}/02-monitoring/config/glance/jellyfin-playing.yml"
      - src: "common/glance/widgets/jellyfin-stats.yml"
        dest: "{{ docker_services_directory }}/02-monitoring/config/glance/jellyfin-stats.yml"
      - src: "common/glance/widgets/media-vpn-stats.yml"
        dest: "{{ docker_services_directory }}/02-monitoring/config/glance/media-vpn-stats.yml"
      - src: "common/glance/widgets/qbittorrent-stats.yml"
        dest: "{{ docker_services_directory }}/02-monitoring/config/glance/qbittorrent-stats.yml"
      - src: "common/glance/widgets/homelab-consumption-stats.yml"
        dest: "{{ docker_services_directory }}/02-monitoring/config/glance/homelab-consumption-stats.yml"
      - src: "common/glance/widgets/internet-speed.yml"
        dest: "{{ docker_services_directory }}/02-monitoring/config/glance/internet-speed.yml"
    crons: []
  - stack_name: "03-cloud"
    services:
      - "onlyoffice"
      # - "paperless"
      - "seafile"
      - "seafile-db"
      - "immich-server"
      - 'immich-redis'
      - "immich-machine-learning"
      - "immich-postgres"
      - "baikal"
      - "vikunja"
      - "dawarich-db"
      - "dawarich-app"
      - "dawarich-sidekiq"
      - "searxng"
    templates: [] 
    configs: []
    crons:
      - name: "Seafile DB daily dump"
        service: "seafile-db"
        service_user: "root"
        job: "sh -c 'mysqldump --all-databases -u root -p\"{{ seafile_root_db_password }}\"' > {{ docker_services_directory }}/03-cloud/data/seafile-dump.sql"
        hour: "0"
        minute: "15"
      - name: "Dawarich Postgres daily dump"
        service: "dawarich_db"
        service_user: "root"
        job: "sh -c 'PGPASSWORD=\"{{ dawarich_db_password }}\" pg_dumpall -U dawarich' > {{ docker_services_directory }}/03-cloud/data/dawarich-dump.sql"
        hour: "1"
        minute: "30"
  - stack_name: "04-media"
    services:
      - "seerr"
      - "prowlarr"
      - "flaresolverr"
      - "radarr"
      - "sonarr"
      - "bazarr"
      - "media-vpn"
      - "qbittorrent"
      # - "dispatcharr"
    templates: []
    configs: []
    crons: []
  - stack_name: "05-automation"
    services:
      - "home-assistant"
      # - "n8n"
    templates:
      - src: "docker/05-automation/config/home-assistant/configuration.yaml.j2"
        dest: "{{ docker_services_directory }}/05-automation/config/home-assistant/configuration.yaml"
      - src: "docker/05-automation/config/home-assistant/packages/plugs.yaml.j2"
        dest: "{{ docker_services_directory }}/05-automation/config/home-assistant/packages/plugs.yaml"
    configs: []
    crons: []
  - stack_name: "06-ai"
    services:
      # - "hermes"
      - "openwebui"
      # - "kokoro-tts"
      # - "ollama"
      # - "litellm"
      # - "litellm-db"
    templates: [] 
    configs: []
    crons: []

extra_packages:
  - lvm2
  - nfs-kernel-server
  - parted
  - python3-psycopg2
  - restic
  - qemu-guest-agent
  - ffmpeg
  - pipx
  - linux-image-amd64

packages: "{{ common_packages + extra_packages }}"

python_packages:
  - spotdl

rclone_configs:
  - name: "protondrive"
    properties:
      type: "protondrive"
      username: "{{ proton_username }}"
      password: "{{ proton_encpassword }}"
      2fa: "{{ proton_2fa }}"
      replace_existing_draft: "true"
      enable_caching: "false"

rclone_mounts:
  - name: "protondrive"
    remote_name: "protondrive" 
    remote_path: "/"
    local_path: "/mnt/protondrive"
    local_path_mode: '0755'
    local_path_owner: "{{ rclone_config_owner.OWNER }}"
    local_path_group: "{{ rclone_config_owner.GROUP }}"
    auto_mount: true
    extra_args: "--allow-other"

repositories:
  - name: "docker"
    apt:
      repo_url: "https://download.docker.com/linux/debian"
      gpg_url: "https://download.docker.com/linux/debian/gpg"
      components:
        - "{{ ansible_facts['distribution_release'] }}"
        - "stable"

restic_backup_configs:
  - name: "docker-services"
    dir_to_backup: "/opt/docker_services"
    local_backup_repo: "{{ backup_mount }}"
    remote_backup_repo: "{{ restic_remote }}:docker_backup"
    excludes:
      - "/opt/docker_services/03-cloud/data/immich-machine-learning"
    cron:
      hour: "4"
      minute: "0"

template_docker_daemon: true
