---

data_mount: "/mnt/data"

loki_url: "http://loki:3100"

promtail_instance: "svr"

server_deb_packages: []

server_directories:
  - "{{ data_mount }}/media/books"
  - "{{ data_mount }}/media/courses"
  - "{{ data_mount }}/media/movies"
  - "{{ data_mount }}/media/music"
  - "{{ data_mount }}/media/others"
  - "{{ data_mount }}/media/quran"
  - "{{ data_mount }}/media/tv"
  - "{{ data_mount }}/torrents"

server_disk_lvs:
  - lv: "docker_backup_lv"
    vg: "backup_vg"
    mount_point: "/mnt/docker_backup"
    size: "256g"
    fstype: "xfs"
  - lv: "data_lv"
    vg: "data_vg"
    mount_point: "{{ data_mount }}"
    size: "400g"
    fstype: "xfs"

server_disk_partitions:
  - partition_number: 1
    device: "/dev/sda"
    flags: [lvm]
    part_start: "0GiB"
    part_end: "256GiB"
  - partition_number: 2
    device: "/dev/sda"
    flags: [lvm]
    part_start: "256GiB"
    part_end: "512GiB"
  - partition_number: 3
    device: "/dev/sda"
    flags: [lvm]
    part_start: "512GiB"
    part_end: "768GiB"
  - partition_number: 4
    device: "/dev/sda"
    flags: [lvm]
    part_start: "768GiB"
    part_end: "100%"

server_disk_vgs:
  - vg: "backup_vg"
    pvs: [/dev/sda1, /dev/sda2]
  - vg: "data_vg"
    pvs: [/dev/sda3, /dev/sda4]

server_docker_networks:
  - frontend
  - backend

server_docker_plugins:
  - name: "grafana/loki-docker-driver:3.4.3-amd64"
    alias: "loki"

server_docker_services:
  - stack_name: "toolbox"
    services:
      - "authelia"
      - "traefik"
      - "whoami"
      - "cloudflare-ddns"
      - "portainer"
      - "postgres"
      - "gluetunvpn"
      - "qbittorrent"
      - "vaultwarden"
    configs:
      - src: "templates/docker/toolbox/config/traefik/external-services.yml.j2"
        dest: "{{ docker_services_directory }}/toolbox/config/traefik/external-services.yml"
      - src: "templates/docker/toolbox/config/traefik/traefik.yml.j2"
        dest: "{{ docker_services_directory }}/toolbox/config/traefik/traefik.yml"
      - src: "templates/docker/toolbox/config/authelia/users_database.yml.j2"
        dest: "{{ docker_services_directory }}/toolbox/config/authelia/users_database.yml"
      - src: "templates/docker/toolbox/config/authelia/configuration.yml.j2"
        dest: "{{ docker_services_directory }}/toolbox/config/authelia/configuration.yml"
    crons: []
  - stack_name: "monitoring"
    services:
      - "grafana"
      - "prometheus"
      - "loki"
      - "cadvisor"
      - "node_exporter"
      - "promtail"
    configs:
      - src: "templates/docker/monitoring/config/prometheus/prometheus.yml.j2"
        dest: "{{ docker_services_directory }}/monitoring/config/prometheus/prometheus.yml"
      - src: "templates/docker/monitoring/config/loki/loki-config.yml.j2"
        dest: "{{ docker_services_directory }}/monitoring/config/loki/loki-config.yml"
      - src: "templates/docker/monitoring/config/promtail/promtail-config.yml.j2"
        dest: "{{ docker_services_directory }}/monitoring/config/promtail/promtail-config.yml"
    crons: []
  - stack_name: "media"
    services:
      - "jellyfin"
      - "jellyseerr"
      - "prowlarr"
      - "flaresolverr"
      - "radarr"
      - "sonarr"
      - "bazarr"
      - "lidarr"
    configs: []
    crons: []
  - stack_name: "nextcloud"
    services:
      - "nextcloud-app"
      - "nextcloud-redis"
      - "nextcloud-db"
      - "nextcloud-onlyoffice"
    configs:
      - src: "templates/docker/nextcloud/config/nextcloud-app/nextcloud.ini.j2"
        dest: "{{ docker_services_directory }}/nextcloud/config/nextcloud-app/nextcloud.ini"
    crons:
      - name: "Nextcloud cron job"
        service: "nextcloud-app"
        service_user: "www-data"
        job: "php /var/www/html/cron.php"
        minute: "*/5"

server_packages:
  - lvm2
  - parted
  - python3-psycopg2

server_python_packages: []

server_rclone_configs:
  # - name: "backblaze"
  #   properties:
  #     type: "b2"
  #     account: "{{ b2_account }}"
  #     key: "{{ b2_appkey }}"
  # - name: "mega"
  #   properties:
  #     type: "mega"
  #     user: "{{ mega_username }}"
  #     pass: "{{ mega_encpassword }}"
  - name: "protondrive"
    properties:
      type: "protondrive"
      username: "{{ proton_username }}"
      password: "{{ proton_encpassword }}"
      2fa: "{{ proton_2fa }}"
      replace_existing_draft: "true"
      enable_caching: "false"

server_rclone_mounts:
  # - name: "backblaze"
  #   remote_name: "backblaze" 
  #   remote_path: "/"
  #   local_path: "/mnt/backblaze"
  #   local_path_mode: "0755"
  #   local_path_owner: "{{ rclone_config_owner.OWNER }}"
  #   local_path_group: "{{ rclone_config_owner.GROUP }}"
  #   auto_mount: true
  #   extra_args: "--allow-other"
  # - name: "mega"
  #   remote_name: "mega" 
  #   remote_path: "/"
  #   local_path: "/mnt/mega"
  #   local_path_mode: '0755'
  #   local_path_owner: "{{ rclone_config_owner.OWNER }}"
  #   local_path_group: "{{ rclone_config_owner.GROUP }}"
  #   auto_mount: true
  #   extra_args: "--allow-other"
  - name: "protondrive"
    remote_name: "protondrive" 
    remote_path: "/"
    local_path: "/mnt/protondrive"
    local_path_mode: '0755'
    local_path_owner: "{{ rclone_config_owner.OWNER }}"
    local_path_group: "{{ rclone_config_owner.GROUP }}"
    auto_mount: true
    extra_args: "--allow-other"

server_repositories:
  - name: "docker"
    repo_url: "https://download.docker.com/linux/debian"
    gpg_url: "https://download.docker.com/linux/debian/gpg"
    gpg_extention: "asc"
    components:
      - "{{ ansible_facts['distribution_release'] }}"
      - "stable"

server_restic_backup_configs:
  - name: "docker-services"
    dir_to_backup: "/opt/docker_services"
    local_backup_repo: "/mnt/docker_backup"
    remote_backup_repo: "{{ restic_remote }}:docker_backup"
    cron:
      hour: "4"
      minute: "0"

server_systemd_services: []

template_docker_daemon: yes