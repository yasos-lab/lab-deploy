---

media_mount: "/mnt/media"

server_deb_packages: []

server_directories:
  - "{{ media_mount }}/downloads"
  - "{{ media_mount }}/movies"
  - "{{ media_mount }}/series"
  - "{{ media_mount }}/music"
  - "{{ media_mount }}/books"
  - "{{ media_mount }}/courses"

server_disk_lvs:
  - lv: "docker_backup_lv"
    vg: "backup_vg"
    mount_point: "/mnt/docker_backup"
    size: "256g"
    fstype: "xfs"
  - lv: "media_lv"
    vg: "media_vg"
    mount_point: "{{ media_mount }}"
    size: "400g"
    fstype: "xfs"

server_disk_partitions:
  - partition_number: 1
    device: "/dev/sda"
    flags: [lvm]
    part_start: "0GiB"
    part_end: "256GiB"
  - partition_number: 2
    device: "/dev/sda"
    flags: [lvm]
    part_start: "256GiB"
    part_end: "512GiB"
  - partition_number: 3
    device: "/dev/sda"
    flags: [lvm]
    part_start: "512GiB"
    part_end: "768GiB"
  - partition_number: 4
    device: "/dev/sda"
    flags: [lvm]
    part_start: "768GiB"
    part_end: "100%"

server_disk_vgs:
  - vg: "backup_vg"
    pvs: [/dev/sda1, /dev/sda2]
  - vg: "media_vg"
    pvs: [/dev/sda3, /dev/sda4]

server_docker_networks:
  - frontend
  - backend

server_docker_plugins:
  - name: "grafana/loki-docker-driver:3.4.3-amd64"
    alias: "loki"

server_docker_services:
  - name: "homarr"
    services:
      - name: "homarr"
        image: "ghcr.io/homarr-labs/homarr:v1.6.0"
        volumes:
          - "./data:/appdata"
          - "/var/run/docker.sock:/var/run/docker.sock"
        environment:
          - "SECRET_ENCRYPTION_KEY={{ homarr_sec }}"
        restart: "unless-stopped"
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.homarr.tls=true"
          - "traefik.http.routers.homarr.tls.certresolver=cloudflare"
          - "traefik.http.routers.homarr.rule=Host(`dash.{{ traefik_domain_name }}`)"
          - "traefik.http.services.homarr.loadbalancer.server.port=7575"
        networks:
          - frontend
    networks:
      - name: "frontend"
        external: true

  - name: "monitoring"
    services:
      - name: "grafana"
        image: "grafana/grafana:latest"
        user: "1000"
        volumes:
          - "./data/grafana/:/var/lib/grafana"
        restart: "unless-stopped"
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.grafana.tls=true"
          - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
          - "traefik.http.routers.grafana.rule=Host(`grafana.{{ traefik_domain_name }}`)"
          - "traefik.http.services.grafana.loadbalancer.server.port=3000"
          - "traefik.docker.network=frontend"
        networks:
          - frontend
          - backend
      - name: "prometheus"
        image: "prom/prometheus:latest"
        user: "1000"
        volumes:
          - "./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
          - "./data/prometheus:/prometheus"
        command: "--config.file=/etc/prometheus/prometheus.yml"
        restart: "unless-stopped"
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.prometheus.tls=true"
          - "traefik.http.routers.prometheus.tls.certresolver=cloudflare"
          - "traefik.http.routers.prometheus.rule=Host(`prometheus.{{ traefik_domain_name }}`)"
          - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
          - "traefik.docker.network=frontend"
        networks:
          - frontend
          - backend
      - name: "loki"
        image: "grafana/loki:latest"
        volumes:
          - "./config/loki/loki-config.yml:/etc/loki/loki-config.yml"
        command: "-config.file=/etc/loki/loki-config.yml"
        restart: "unless-stopped"
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.loki.tls=true"
          - "traefik.http.routers.loki.tls.certresolver=cloudflare"
          - "traefik.http.routers.loki.rule=Host(`loki.{{ traefik_domain_name }}`)"
          - "traefik.http.services.loki.loadbalancer.server.port=3100"
          - "traefik.docker.network=frontend"
        networks:
          - frontend
          - backend
      - name: "cadvisor"
        image: "gcr.io/cadvisor/cadvisor:latest"
        volumes:
          - "/:/rootfs:ro"
          - "/var/run:/var/run:rw"
          - "/sys:/sys:ro"
          - "/var/lib/docker/:/var/lib/docker:ro"
        restart: "unless-stopped"
        networks:
          - backend
      - name: "node_exporter"
        image: "quay.io/prometheus/node-exporter:latest"
        volumes:
          - "/:/host:ro,rslave"
        restart: "unless-stopped"
        command: "--path.rootfs=/host"
        pid: host
        networks:
          - backend
      - name: promtail
        image: "grafana/promtail:latest"
        volumes:
          - "/var/log:/var/log"
          - "./config/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml"
        restart: "unless-stopped"
        command: "-config.file=/etc/promtail/promtail-config.yml"
        networks:
          - backend
    networks:
      - name: "frontend"
        external: true
      - name: "backend"
        external: true

  - name: "media"
    services:
      - name: "jellyfin"
        image: "lscr.io/linuxserver/jellyfin:latest"
        volumes:
          - "./config/jellyfin:/config"
          - "{{ media_mount }}/series:/tv"
          - "{{ media_mount }}/movies:/movies"
        environment:
          - "PUID=1000"
          - "PGID=1000"
          - "TZ={{ timezone }}"
        restart: "unless-stopped"
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.jellyfin.tls=true"
          - "traefik.http.routers.jellyfin.tls.certresolver=cloudflare"
          - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.{{ traefik_domain_name }}`)"
          - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
        networks:
          - frontend
      - name: "jellyserr"
        image: "ghcr.io/fallenbagel/jellyseerr:latest"
        volumes:
          - "./config/jellyserr:/app/config"
        environment:
          - "PUID=1000"
          - "PGID=1000"
          - "TZ={{ timezone }}"
        restart: "unless-stopped"
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.jellyseerr.tls=true"
          - "traefik.http.routers.jellyseerr.tls.certresolver=cloudflare"
          - "traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.media.{{ traefik_domain_name }}`)"
          - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"
        networks:
          - frontend
      - name: "sonarr"
        image: "lscr.io/linuxserver/sonarr:latest"
        network_mode: "service:gluetun"
        volumes:
          - "./config/sonarr:/config"
          - "{{ media_mount }}/series:/tv"
          - "{{ media_mount }}/downloads:/downloads"
        environment:
          - "PUID=1000"
          - "PGID=1000"
          - "TZ={{ timezone }}"
        restart: "unless-stopped"
      - name: "radarr"
        image: "lscr.io/linuxserver/radarr:latest"
        network_mode: "service:gluetun"
        volumes:
          - "./config/radarr:/config"
          - "{{ media_mount }}/movies:/movies"
          - "{{ media_mount }}/downloads:/downloads"
        environment:
          - "PUID=1000"
          - "PGID=1000"
          - "TZ={{ timezone }}"
        restart: "unless-stopped"
      - name: "bazarr"
        image: "lscr.io/linuxserver/bazarr:latest"
        network_mode: "service:gluetun"
        volumes:
          - "./config/bazarr:/config"
          - "{{ media_mount }}/movies:/movies"
          - "{{ media_mount }}/series:/tv"
        environment:
          - "PUID=1000"
          - "PGID=1000"
          - "TZ={{ timezone }}"
        restart: "unless-stopped"
      - name: "readarr"
        image: lscr.io/linuxserver/readarr:develop
        network_mode: "service:gluetun"
        volumes:
          - "./config/readarr:/config"
          - "{{ media_mount }}/books:/books"
          - "{{ media_mount }}/downloads:/downloads"
        environment:
          - "PUID=1000"
          - "PGID=1000"
          - "TZ={{ timezone }}"
        restart: "unless-stopped"
      - name: "lidarr"
        image: "lscr.io/linuxserver/lidarr:latest"
        network_mode: "service:gluetun"
        volumes:
          - "./config/lidarr:/config"
          - "{{ media_mount }}/music:/music"
          - "{{ media_mount }}/downloads:/downloads"
        environment:
          - "PUID=1000"
          - "PGID=1000"
          - "TZ={{ timezone }}"
        restart: "unless-stopped"
      - name: "gluetun"
        image: "qmcgaw/gluetun:latest"
        cap_add:
          - "NET_ADMIN"
        devices:
          - "/dev/net/tun:/dev/net/tun"
        environment:
          - "VPN_SERVICE_PROVIDER={{ vpn_provider }}"
          - "VPN_TYPE=wireguard"
          - "WIREGUARD_PRIVATE_KEY={{ vpn_private_key }}"
          - "SERVER_COUNTRIES={{ vpn_countries }}"
          - "PORT_FORWARD_ONLY=on"
        restart: "unless-stopped"
        expose:
          - "8989" # sonarr
          - "7878" # radarr
          - "6767" # bazarr
          - "8787" # readarr
          - "8686" # lidarr
          - "9696" # prowlarr
          - "8080" # qbittorrent ui
          - "6881/tcp" # qbittorrent torrent tcp
          - "6881/udp" # qbittorrent torrent udp
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.radarr.tls=true"
          - "traefik.http.routers.radarr.tls.certresolver=cloudflare"
          - "traefik.http.routers.radarr.rule=Host(`radarr.media.yasos.org`)"
          - "traefik.http.routers.radarr.service=radarr-service"
          - "traefik.http.services.radarr-service.loadbalancer.server.port=7878"
          - "traefik.http.routers.sonarr.tls=true"
          - "traefik.http.routers.sonarr.tls.certresolver=cloudflare"
          - "traefik.http.routers.sonarr.rule=Host(`sonarr.media.yasos.org`)"
          - "traefik.http.routers.sonarr.service=sonarr-service"
          - "traefik.http.services.sonarr-service.loadbalancer.server.port=8989"
          - "traefik.http.routers.lidarr.tls=true"
          - "traefik.http.routers.lidarr.tls.certresolver=cloudflare"
          - "traefik.http.routers.lidarr.rule=Host(`lidarr.media.yasos.org`)"
          - "traefik.http.routers.lidarr.service=lidarr-service"
          - "traefik.http.services.lidarr-service.loadbalancer.server.port=8686"
          - "traefik.http.routers.readarr.tls=true"
          - "traefik.http.routers.readarr.tls.certresolver=cloudflare"
          - "traefik.http.routers.readarr.rule=Host(`readarr.media.yasos.org`)"
          - "traefik.http.routers.readarr.service=readarr-service"
          - "traefik.http.services.readarr-service.loadbalancer.server.port=8787"
          - "traefik.http.routers.bazarr.tls=true"
          - "traefik.http.routers.bazarr.tls.certresolver=cloudflare"
          - "traefik.http.routers.bazarr.rule=Host(`bazarr.media.yasos.org`)"
          - "traefik.http.routers.bazarr.service=bazarr-service"
          - "traefik.http.services.bazarr-service.loadbalancer.server.port=6767"
          - "traefik.http.routers.qbittorrent.tls=true"
          - "traefik.http.routers.qbittorrent.tls.certresolver=cloudflare"
          - "traefik.http.routers.qbittorrent.rule=Host(`torrent.media.{{ traefik_domain_name }}`)"
          - "traefik.http.routers.qbittorrent.service=qbittorrent-service"
          - "traefik.http.services.qbittorrent-service.loadbalancer.server.port=8080"
          - "traefik.http.routers.prowlarr.tls=true"
          - "traefik.http.routers.prowlarr.tls.certresolver=cloudflare"
          - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.media.{{ traefik_domain_name }}`)"
          - "traefik.http.routers.prowlarr.service=prowlarr-service"
          - "traefik.http.services.prowlarr-service.loadbalancer.server.port=9696"
        networks:
          - frontend
      - name: "prowlarr"
        image: "lscr.io/linuxserver/prowlarr:latest"
        network_mode: "service:gluetun"
        volumes:
          - "./config/prowlarr:/config"
        environment:
          - "PUID=1000"
          - "PGID=1000"
          - "TZ={{ timezone }}"
        restart: "unless-stopped"
      - name: "qbittorrent"
        image: "lscr.io/linuxserver/qbittorrent:latest"
        network_mode: "service:gluetun"
        volumes:
          - "./config/qbittorrent:/config"
          - "{{ media_mount }}/downloads:/downloads"
        environment:
          - "PUID=1000"
          - "PGID=1000"
          - "TZ={{ timezone }}"
        restart: "unless-stopped"
    networks:
      - name: "frontend"
        external: true

  - name: "nextcloud"
    services:
      - name: "nextcloud-app"
        image: "nextcloud:30"
        volumes:
          - "./data/app:/var/www/html"
          - "./config/nextcloud.ini:/usr/local/etc/php/conf.d/nextcloud.ini"
        depends_on:
          - "nextcloud-redis"
          - "nextcloud-db"
          - "nextcloud-onlyoffice"
        environment:
          - "MYSQL_HOST=nextcloud-db"
          - "MYSQL_PASSWORD={{ nextcloud_db_password }}"
          - "MYSQL_DATABASE={{ nextcloud_db }}"
          - "MYSQL_USER={{ nextcloud_db_user }}"
          - "REDIS_HOST=nextcloud-redis"
          - "TRUSTED_PROXIES=192.168.1.20"
          - "NEXTCLOUD_TRUSTED_DOMAINS=cloud.{{ traefik_domain_name }}"
          - "OVERWRITECLIURL=https://cloud.{{ traefik_domain_name }}"
          - "OVERWRITEPROTOCOL=https"
        restart: "unless-stopped"
        networks:
          - "frontend"
          - "backend"
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.nextcloud.tls=true"
          - "traefik.http.routers.nextcloud.tls.certresolver=cloudflare"
          - "traefik.http.routers.nextcloud.rule=Host(`cloud.{{ traefik_domain_name }}`)"
          - "traefik.http.middlewares.secure_headers.headers.stsSeconds=15552000"
          - "traefik.http.middlewares.secure_headers.headers.stsIncludeSubdomains=true"
          - "traefik.http.middlewares.secure_headers.headers.stsPreload=true"
          - "traefik.http.routers.nextcloud.middlewares=secure_headers"
          - "traefik.docker.network=frontend"
        post_start:
          commands:
            - "apt update"
            - "apt install -y sudo nano ffmpeg"
      - name: "nextcloud-redis"
        image: "redis:6"
        restart: "unless-stopped"
        healthcheck:
          test: redis-cli ping || exit 1
        networks:
          - "backend"
      - name: "nextcloud-db"
        image: "mariadb:10"
        volumes:
          - "./data/db:/var/lib/mysql"
        command: "--transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW"
        environment:
          - "MYSQL_ROOT_PASSWORD={{ nextcloud_root_db_password }}"
          - "MYSQL_PASSWORD={{ nextcloud_db_password }}"
          - "MYSQL_DATABASE={{ nextcloud_db }}"
          - "MYSQL_USER={{ nextcloud_db_user }}"
        restart: "unless-stopped"
        networks:
          - "backend"
      - name: "nextcloud-onlyoffice"
        image: "onlyoffice/documentserver:latest"
        environment:
          - "JWT_SECRET={{ nextcloud_onlyoffice_jwt }}"
        restart: "unless-stopped"
        networks:
          - "frontend"
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.office.tls=true"
          - "traefik.http.routers.office.tls.certresolver=cloudflare"
          - "traefik.http.routers.office.rule=Host(`office.cloud.{{ traefik_domain_name }}`)"
          - "traefik.http.middlewares.x_forwarded_proto.headers.customrequestheaders.X-Forwarded-Proto=https"
          - "traefik.http.routers.office.middlewares=x_forwarded_proto"
    networks:
      - name: "frontend"
        external: true
      - name: "backend"
        external: true

  - name: "portainer"
    services:
      - name: "portainer"
        image: "portainer/portainer-ce:latest"
        volumes:
          - "./data:/data"
          - "/var/run/docker.sock:/var/run/docker.sock"
        restart: "unless-stopped"
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.portainer.tls=true"
          - "traefik.http.routers.portainer.tls.certresolver=cloudflare"
          - "traefik.http.routers.portainer.rule=Host(`portainer.{{ traefik_domain_name }}`)"
          - "traefik.http.services.portainer.loadbalancer.server.port=9000"
        networks:
          - frontend
    networks:
      - name: "frontend"
        external: true

  - name: "postgres"
    services:
      - name: "postgres_db"
        image: "postgres:latest"
        environment:
          - "POSTGRES_DB={{ postgres_db }}"
          - "POSTGRES_USER={{ postgres_db_user }}"
          - "POSTGRES_PASSWORD={{ postgres_db_password }}"
        volumes:
          - "./data:/var/lib/postgresql/data"
        ports:
          - "5432:5432"
        networks:
          - "backend"
        restart: "unless-stopped"
    networks:
      - name: "backend"
        external: true

  - name: "traefik"
    services:
      - name: "traefik"
        image: "traefik:v3"
        volumes:
          - "./config/ssl:/ssl:rw"
          - "./config/traefik.yml:/etc/traefik/traefik.yml:ro"
          - "/var/run/docker.sock:/var/run/docker.sock:ro"
        ports:
          - "80:80"
          - "443:443"
        restart: "unless-stopped"
        environment:
          - "CF_DNS_API_TOKEN={{ traefik_dns_api_token }}"
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.traefik.tls=true"
          - "traefik.http.routers.traefik.tls.certresolver=cloudflare"
          - "traefik.http.routers.traefik.rule=Host(`proxy.{{ traefik_domain_name }}`)"
          - "traefik.http.routers.traefik.service=api@internal"
          - "traefik.http.middlewares.traefik-auth.basicauth.users={{ traefik_user }}:{{ traefik_hash_password | regex_replace('\\$', '$$') }}" # To escape $ in the password hash
          - "traefik.http.routers.traefik.middlewares=traefik-auth"
        networks:
          - frontend
      - name: "whoami"
        image: "traefik/whoami"
        restart: "unless-stopped"
        networks:
          - frontend
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.whoami.tls=true"
          - "traefik.http.routers.whoami.tls.certresolver=cloudflare"
          - "traefik.http.routers.whoami.rule=Host(`whoami.{{ traefik_domain_name }}`)"
    networks:
      - name: "frontend"
        external: true

  - name: "vaultwarden"
    services:
      - name: "vaultwarden"
        image: "vaultwarden/server:1.33.2"
        volumes:
          - "./data:/data"
          - "/etc/localtime:/etc/localtime"
        environment:
          - "SIGNUPS_ALLOWED=false"
          - "TZ=Europe/Paris"
          - "ADMIN_TOKEN={{ vaultwarden_admin_token | replace('$', '$$') }}"
        restart: "unless-stopped"
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.vaultwarden.tls=true"
          - "traefik.http.routers.vaultwarden.tls.certresolver=cloudflare"
          - "traefik.http.routers.vaultwarden.rule=Host(`vault.{{ traefik_domain_name }}`)"
          #- "traefik.http.services.vaultwarden.loadbalancer.server.port=7575"
        networks:
          - frontend
    networks:
      - name: "frontend"
        external: true

server_docker_services_configs:
  - src: "templates/traefik/config/traefik.yml.j2"
    dest: "{{ docker_services_directory }}/traefik/config/traefik.yml"
  - src: "templates/nextcloud/config/nextcloud.ini.j2"
    dest: "{{ docker_services_directory }}/nextcloud/config/nextcloud.ini"
  - src: "templates/monitoring/config/prometheus.yml.j2"
    dest: "{{ docker_services_directory }}/monitoring/config/prometheus/prometheus.yml"
  - src: "templates/monitoring/config/loki-config.yml.j2"
    dest: "{{ docker_services_directory }}/monitoring/config/loki/loki-config.yml"
  - src: "templates/monitoring/config/promtail-config.yml.j2"
    dest: "{{ docker_services_directory }}/monitoring/config/promtail/promtail-config.yml"

server_docker_services_crons:
  - name: "Nextcloud cron job"
    service: "nextcloud-app"
    service_user: "www-data"
    job: "php /var/www/html/cron.php"
    minute: "*/5"

server_packages:
  - lvm2
  - parted
  - python3-psycopg2

server_python_packages: []

server_rclone_configs: []
  # - name: "backblaze"
  #   properties:
  #     type: "b2"
  #     account: "{{ b2_account }}"
  #     key: "{{ b2_appkey }}"

server_rclone_mounts: []
  # - name: "backblaze"
  #   remote_name: "backblaze" 
  #   remote_path: "/"
  #   local_path: "/mnt/backblaze"
  #   local_path_mode: '0755'
  #   local_path_owner: "{{ rclone_config_owner.OWNER }}"
  #   local_path_group: "{{ rclone_config_owner.GROUP }}"
  #   auto_mount: true
  #   extra_args: ""

server_repositories:
  - name: "docker"
    repo_url: "https://download.docker.com/linux/debian"
    gpg_url: "https://download.docker.com/linux/debian/gpg"
    gpg_extention: "asc"
    components:
      - "{{ ansible_facts['distribution_release'] }}"
      - "stable"

server_restic_backup_configs:
  - name: "docker-services"
    dir_to_backup: "/opt/docker_services"
    local_backup_repo: "/mnt/docker_backup"
    remote_backup_repo: "{{ restic_remote }}:docker_backup"
    cron:
      hour: "4"
      minute: "0"

server_systemd_services: []