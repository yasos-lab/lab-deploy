---

server_databases:
  - name: "{{ nextclouddb }}"
    user: "{{ nextclouddb_user }}"
    password: "{{ nextclouddb_password }}"
  - name: "{{ immichdb }}"
    user: "{{ immichdb_user }}"
    password: "{{ immichdb_password }}"

server_docker_services: []

server_directories: []

server_directories_to_remove: []

server_packages:
  - python3-psycopg2
  - syncthing

server_python_packages: []

server_repositories:
  - name: "docker"
    repo_url: "https://download.docker.com/linux/debian"
    gpg_url: "https://download.docker.com/linux/debian/gpg"
    gpg_extention: "asc"
    components:
      - "{{ ansible_facts['distribution_release'] }}"
      - "stable"

server_systemd_services: []