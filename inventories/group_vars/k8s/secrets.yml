---
# Kubernetes Secrets to create post-deployment.
# Values reference vault-encrypted variables from group_vars/all/secrets.yml.
# Uncomment and add your secrets, then run:
#   ansible-playbook -i inventories/hosts.yml deploy-kubernetes.yml --vault-password-file .vault-pass --tags k8s::secrets
#
# Supported types:
#   - Opaque          : generic key-value pairs
#   - docker-registry : image pull secret
#   - kubernetes.io/tls: TLS certificate (cert_file/key_file are local paths on the control-plane node)

k8s_secrets: []
  # --- Docker registry pull secret ---
  # - name: regcred
  #   namespace: flux-system
  #   type: docker-registry
  #   data:
  #     registry: ghcr.io
  #     username: "{{ github_user }}"
  #     password: "{{ github_token }}"
  #     email: "{{ github_email }}"

  # --- Opaque application secrets ---
  # - name: app-db
  #   namespace: my-app
  #   type: Opaque
  #   data:
  #     DB_USER: "{{ app_db_user }}"
  #     DB_PASS: "{{ app_db_pass }}"
  #
  # - name: api-keys
  #   namespace: my-app
  #   type: Opaque
  #   data:
  #     API_KEY: "{{ my_api_key }}"
  #     API_SECRET: "{{ my_api_secret }}"

  # --- TLS secret (cert/key files already on the node) ---
  # - name: ingress-tls
  #   namespace: istio-system
  #   type: kubernetes.io/tls
  #   data:
  #     cert_file: /etc/ssl/certs/my-cert.pem
  #     key_file: /etc/ssl/private/my-key.pem
