---

backup_mount: "/mnt/backup"

media_mount: "/mnt/media"

docker_traefik_subnet: '172.18.0.0/16'

glance_monitor_services:
  - title: "Network & Infra"
    sites:
      - name: "Pihole"
        url: "https://pihole.{{ domain_name }}/admin"
      - name: "Gateway"
        url: "https://gateway.{{ domain_name}}"
        icon: "si:eclipsemosquitto"
      - name: "Proxmox"
        url: "https://proxmox.{{ domain_name }}"
      - name: "Traefik"
        url: "https://proxy.{{ domain_name}}"
        icon: "si:traefikproxy"
      - name: "Authelia"
        url: "https://sso.{{ domain_name }}"
      - name: "Speedtest"
        url: "https://speedtest.{{ domain_name}}"
      - name: "Grafana"
        url: "https://grafana.{{ domain_name}}"
      - name: "Portainer"
        url: "https://portainer.{{ domain_name}}"
      - name: "Zerobyte"
        url: "https://zerobyte.{{ domain_name}}"
        icon: "sh:zerobyte"
  - title: "Services"
    sites:
      - name: "Nextcloud"
        url: "https://cloud.{{ domain_name }}"
      - name: "Paperless"
        url: "https://paperless.{{ domain_name}}"
        icon: "si:paperlessngx"
      - name: "Vaultwarden"
        url: "https://vaultwarden.{{ domain_name }}"
      - name: "Home assistant"
        url: "https://home-assistant.{{ domain_name}}"
      - name: "N8n"
        url: "https://n8n.{{ domain_name }}"
  - title: "Media"
    sites:
      - name: "Jellyfin"
        url: "https://jellyfin.{{ domain_name }}"
      - name: "Jellyseerr"
        url: "https://jellyseerr.media.{{ domain_name}}"
        icon: "sh:jellyseerr"
      - name: "Radarr"
        url: "https://radarr.media.{{ domain_name}}"
      - name: "Sonarr"
        url: "https://sonarr.media.{{ domain_name}}"
      - name: "Bazarr"
        url: "https://bazarr.media.{{ domain_name}}"
        icon: "sh:bazarr"
      - name: "Prowlarr"
        url: "https://prowlarr.media.{{ domain_name}}"
        icon: "sh:prowlarr"
      - name: "Qbittorrent"
        url: "https://torrent.{{ domain_name}}"

glance_mountpoints_to_monitor:
  - name: "Root"
    path: "/"
  - name: "Docker services"
    path: "{{ docker_services_directory }}"
  - name: "Backup"
    path: "{{ backup_mount }}"
  - name: "Media"
    path: "{{ media_mount }}"
  # - name: "Proxmox backup"
  #   path: ""

loki_url: "http://loki:3100"

promtail_instance: "svr"

server_deb_packages: []

server_directories:
  - "{{ backup_mount }}/docker_backup"
  - "{{ media_mount }}/library/books"
  - "{{ media_mount }}/library/courses"
  - "{{ media_mount }}/library/movies"
  - "{{ media_mount }}/library/music"
  - "{{ media_mount }}/library/other"
  - "{{ media_mount }}/library/quran"
  - "{{ media_mount }}/library/tv"
  - "{{ media_mount }}/torrents"

server_disk_lvs: []

server_docker_networks:
  - frontend
  - backend

server_docker_plugins:
  - name: "grafana/loki-docker-driver:3.4.3-amd64"
    alias: "loki"

server_docker_services:
  - stack_name: "00-network"
    services:
      - "authelia"
      - "traefik"
      - "whoami"
      - "cloudflare-ddns"
      - "speedtest"
    templates:
      - src: "../templates/docker/00-network/config/traefik/external-services.yml.j2"
        dest: "{{ docker_services_directory }}/00-network/config/traefik/external-services.yml"
      - src: "../templates/docker/00-network/config/traefik/traefik.yml.j2"
        dest: "{{ docker_services_directory }}/00-network/config/traefik/traefik.yml"
      - src: "../templates/docker/00-network/config/authelia/users_database.yml.j2"
        dest: "{{ docker_services_directory }}/00-network/config/authelia/users_database.yml"
      - src: "../templates/docker/00-network/config/authelia/configuration.yml.j2"
        dest: "{{ docker_services_directory }}/00-network/config/authelia/configuration.yml"
    configs: []
    crons: []
  - stack_name: "01-core"
    services:
      - "portainer"
      - "vaultwarden"
      - "zerobyte"
    configs: []
    templates: []
    crons: []
  - stack_name: "02-monitoring"
    services:
      - "grafana"
      - "prometheus"
      - "loki"
      - "cadvisor"
      - "node_exporter"
      - "promtail"
      - "glance"
      - "uptime-kuma"
    templates:
      - src: "../templates/docker/02-monitoring/config/glance/glance.yml.j2"
        dest: "{{ docker_services_directory }}/02-monitoring/config/glance/glance.yml"
      - src: "../templates/docker/02-monitoring/config/prometheus/prometheus.yml.j2"
        dest: "{{ docker_services_directory }}/02-monitoring/config/prometheus/prometheus.yml"
      - src: "../templates/docker/02-monitoring/config/loki/loki-config.yml.j2"
        dest: "{{ docker_services_directory }}/02-monitoring/config/loki/loki-config.yml"
      - src: "../templates/docker/02-monitoring/config/promtail/promtail-config.yml.j2"
        dest: "{{ docker_services_directory }}/02-monitoring/config/promtail/promtail-config.yml"
    configs:
      - src: "../files/glance/widgets/jellyfin-playing.yml"
        dest: "{{ docker_services_directory }}/02-monitoring/config/glance/jellyfin-playing.yml"
      - src: "../files/glance/widgets/jellyfin-stats.yml"
        dest: "{{ docker_services_directory }}/02-monitoring/config/glance/jellyfin-stats.yml"
      - src: "../files/glance/widgets/media-vpn-stats.yml"
        dest: "{{ docker_services_directory }}/02-monitoring/config/glance/media-vpn-stats.yml"
      - src: "../files/glance/widgets/qbittorrent-stats.yml"
        dest: "{{ docker_services_directory }}/02-monitoring/config/glance/qbittorrent-stats.yml"
      - src: "../files/glance/widgets/homelab-consumption-stats.yml"
        dest: "{{ docker_services_directory }}/02-monitoring/config/glance/homelab-consumption-stats.yml"
      - src: "../files/glance/widgets/internet-speed.yml"
        dest: "{{ docker_services_directory }}/02-monitoring/config/glance/internet-speed.yml"
    crons: []
  - stack_name: "03-cloud"
    services:
      - "nextcloud"
      - "redis"
      - "maria-db"
      - "onlyoffice"
      - "paperless"
    templates:
      - src: "../templates/docker/03-cloud/config/nextcloud/nextcloud.ini.j2"
        dest: "{{ docker_services_directory }}/03-cloud/config/nextcloud/nextcloud.ini"
    configs: []
    crons:
      - name: "Nextcloud cron job"
        service: "nextcloud"
        service_user: "www-data"
        job: "php /var/www/html/cron.php"
        minute: "*/5"
  - stack_name: "04-media"
    services:
      - "jellyfin"
      - "jellyseerr"
      - "prowlarr"
      - "flaresolverr"
      - "radarr"
      - "sonarr"
      - "bazarr"
      - "media-vpn"
      - "qbittorrent"
    templates: []
    configs: []
    crons: []
  - stack_name: "05-automation"
    services:
      - "home-assistant"
      - "n8n"
    templates:
      - src: "../templates/docker/05-automation/config/home-assistant/configuration.yaml.j2"
        dest: "{{ docker_services_directory }}/05-automation/config/home-assistant/configuration.yaml"
      - src: "../templates/docker/05-automation/config/home-assistant/packages/plugs.yaml.j2"
        dest: "{{ docker_services_directory }}/05-automation/config/home-assistant/packages/plugs.yaml"
    configs: []
    crons: []
server_packages:
  - lvm2
  - nfs-kernel-server
  - parted
  - python3-psycopg2

server_python_packages: []

server_rclone_configs:
  - name: "protondrive"
    properties:
      type: "protondrive"
      username: "{{ proton_username }}"
      password: "{{ proton_encpassword }}"
      2fa: "{{ proton_2fa }}"
      replace_existing_draft: "true"
      enable_caching: "false"

server_rclone_mounts:
  - name: "protondrive"
    remote_name: "protondrive" 
    remote_path: "/"
    local_path: "/mnt/protondrive"
    local_path_mode: '0755'
    local_path_owner: "{{ rclone_config_owner.OWNER }}"
    local_path_group: "{{ rclone_config_owner.GROUP }}"
    auto_mount: true
    extra_args: "--allow-other"

server_repositories:
  - name: "docker"
    repo_url: "https://download.docker.com/linux/ubuntu"
    gpg_url: "https://download.docker.com/linux/ubuntu/gpg"
    gpg_extention: "asc"
    components:
      - "{{ ansible_facts['distribution_release'] }}"
      - "stable"

server_restic_backup_configs:
  - name: "docker-services"
    dir_to_backup: "/opt/docker_services"
    local_backup_repo: "{{ backup_mount }}/docker_backup"
    remote_backup_repo: "{{ restic_remote }}:docker_backup"
    cron:
      hour: "4"
      minute: "0"

server_systemd_services: []

template_docker_daemon: true