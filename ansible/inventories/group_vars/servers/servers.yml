---

backup_mount: "/mnt/backup"

media_mount: "/mnt/media"

docker_traefik_subnet: '172.18.0.0/16'

loki_url: "http://loki:3100"

promtail_instance: "svr"

server_deb_packages: []

server_directories:
  - "{{ backup_mount }}/docker_backup"
  - "{{ media_mount }}/library/books"
  - "{{ media_mount }}/library/courses"
  - "{{ media_mount }}/library/movies"
  - "{{ media_mount }}/library/music"
  - "{{ media_mount }}/library/other"
  - "{{ media_mount }}/library/quran"
  - "{{ media_mount }}/library/tv"
  - "{{ media_mount }}/torrents"

server_disk_lvs:
  - lv: "lv_backup" # 256G
    vg: "vg_sata"
    mount_point: "{{ backup_mount }}"
    fstype: "ext4"
  - lv: "lv_media" # 512G
    vg: "vg_sata"
    mount_point: "{{ media_mount }}"
    fstype: "xfs"
  - lv: "lv_backup" # 256G
    vg: "vg_sata"
    mount_point: "/mnt/proxmox_backup"
    fstype: "ext4"

server_docker_networks:
  - frontend
  - backend

server_docker_plugins:
  - name: "grafana/loki-docker-driver:3.4.3-amd64"
    alias: "loki"

server_docker_services:
  - stack_name: "00-network"
    services:
      - "authelia"
      - "traefik"
      - "whoami"
      - "cloudflare-ddns"
    templates:
      - src: "../templates/docker/00-network/config/traefik/external-services.yml.j2"
        dest: "{{ docker_services_directory }}/00-network/config/traefik/external-services.yml"
      - src: "../templates/docker/00-network/config/traefik/traefik.yml.j2"
        dest: "{{ docker_services_directory }}/00-network/config/traefik/traefik.yml"
      - src: "../templates/docker/00-network/config/authelia/users_database.yml.j2"
        dest: "{{ docker_services_directory }}/00-network/config/authelia/users_database.yml"
      - src: "../templates/docker/00-network/config/authelia/configuration.yml.j2"
        dest: "{{ docker_services_directory }}/00-network/config/authelia/configuration.yml"
    configs: []
    crons: []
  - stack_name: "01-core"
    services:
      - "portainer"
      - "vaultwarden"
    templates: []
    configs: []
    crons: []
  - stack_name: "02-monitoring"
    services:
      - "grafana"
      - "prometheus"
      - "loki"
      - "cadvisor"
      - "node_exporter"
      - "promtail"
    templates:
      - src: "../templates/docker/02-monitoring/config/prometheus/prometheus.yml.j2"
        dest: "{{ docker_services_directory }}/02-monitoring/config/prometheus/prometheus.yml"
      - src: "../templates/docker/02-monitoring/config/loki/loki-config.yml.j2"
        dest: "{{ docker_services_directory }}/02-monitoring/config/loki/loki-config.yml"
      - src: "../templates/docker/02-monitoring/config/promtail/promtail-config.yml.j2"
        dest: "{{ docker_services_directory }}/02-monitoring/config/promtail/promtail-config.yml"
    configs: []
    crons: []
  - stack_name: "03-cloud"
    services:
      - "nextcloud"
      - "redis"
      - "maria-db"
      - "onlyoffice"
      - "paperless"
    templates:
      - src: "../templates/docker/03-cloud/config/nextcloud/nextcloud.ini.j2"
        dest: "{{ docker_services_directory }}/03-cloud/config/nextcloud/nextcloud.ini"
    configs: []
    crons:
      - name: "Nextcloud cron job"
        service: "nextcloud"
        service_user: "www-data"
        job: "php /var/www/html/cron.php"
        minute: "*/5"
  - stack_name: "04-media"
    services:
      - "jellyfin"
      - "jellyseerr"
      - "prowlarr"
      - "flaresolverr"
      - "radarr"
      - "sonarr"
      - "bazarr"
      - "gluetunvpn"
      - "qbittorrent"
    templates: []
    configs: []
    crons: []
  - stack_name: "05-automation"
    services:
      - "home-assistant"
      - "n8n"
    templates:
      - src: "../templates/docker/05-automation/config/home-assistant/configuration.yaml.j2"
        dest: "{{ docker_services_directory }}/05-automation/config/home-assistant/configuration.yaml"
      - src: "../templates/docker/05-automation/config/home-assistant/packages/plugs.yaml.j2"
        dest: "{{ docker_services_directory }}/05-automation/config/home-assistant/packages/plugs.yaml"
    configs: []
    crons: []
server_packages:
  - lvm2
  - nfs-kernel-server
  - parted
  - python3-psycopg2

server_python_packages: []

server_rclone_configs:
  # - name: "backblaze"
  #   properties:
  #     type: "b2"
  #     account: "{{ b2_account }}"
  #     key: "{{ b2_appkey }}"
  # - name: "mega"
  #   properties:
  #     type: "mega"
  #     user: "{{ mega_username }}"
  #     pass: "{{ mega_encpassword }}"
  - name: "protondrive"
    properties:
      type: "protondrive"
      username: "{{ proton_username }}"
      password: "{{ proton_encpassword }}"
      2fa: "{{ proton_2fa }}"
      replace_existing_draft: "true"
      enable_caching: "false"

server_rclone_mounts:
  # - name: "backblaze"
  #   remote_name: "backblaze" 
  #   remote_path: "/"
  #   local_path: "/mnt/backblaze"
  #   local_path_mode: "0755"
  #   local_path_owner: "{{ rclone_config_owner.OWNER }}"
  #   local_path_group: "{{ rclone_config_owner.GROUP }}"
  #   auto_mount: true
  #   extra_args: "--allow-other"
  # - name: "mega"
  #   remote_name: "mega" 
  #   remote_path: "/"
  #   local_path: "/mnt/mega"
  #   local_path_mode: '0755'
  #   local_path_owner: "{{ rclone_config_owner.OWNER }}"
  #   local_path_group: "{{ rclone_config_owner.GROUP }}"
  #   auto_mount: true
  #   extra_args: "--allow-other"
  - name: "protondrive"
    remote_name: "protondrive" 
    remote_path: "/"
    local_path: "/mnt/protondrive"
    local_path_mode: '0755'
    local_path_owner: "{{ rclone_config_owner.OWNER }}"
    local_path_group: "{{ rclone_config_owner.GROUP }}"
    auto_mount: true
    extra_args: "--allow-other"

server_repositories:
  - name: "docker"
    repo_url: "https://download.docker.com/linux/debian"
    gpg_url: "https://download.docker.com/linux/debian/gpg"
    gpg_extention: "asc"
    components:
      - "{{ ansible_facts['distribution_release'] }}"
      - "stable"

server_restic_backup_configs:
  - name: "docker-services"
    dir_to_backup: "/opt/docker_services"
    local_backup_repo: "{{ backup_mount }}/docker_backup"
    remote_backup_repo: "{{ restic_remote }}:docker_backup"
    cron:
      hour: "4"
      minute: "0"

server_systemd_services: []

template_docker_daemon: true