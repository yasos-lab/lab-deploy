---

all:
  children:
    workstations:
      hosts:
        ubuntu_thinkpad:
          ansible_host: "127.0.0.1"
          ansible_user: "{{ tp_ws_user }}"
          ansible_ssh_pass: "{{ tp_ws_pass }}"
          ansible_become_password: "{{ tp_ws_pass }}"
    servers:
      hosts:
        debian_thinkcenter:
          ansible_host: "{{ lan_prefix }}.20"
          ansible_user: "{{ tc_svr_user }}"
          ansible_ssh_pass: "{{ tc_svr_pass }}"
          ansible_become_password: "{{ tc_svr_pass }}"
    raspberries:
      hosts:
        raspberry_pi_1:
          ansible_host: "{{ lan_prefix }}.10"
          ansible_user: "{{ rbp_user }}"
          ansible_ssh_pass: "{{ rbp_pass }}"
          ansible_become_password: "{{ rbp_pass }}"
    proxmox:
      hosts:
        proxmox_optiplex:
          ansible_host: "{{ lan_prefix }}.30"
          ansible_user: "root"
          ansible_ssh_pass: "{{ proxmox_pass }}"
          ansible_become_password: "{{ proxmox_pass }}"
          # ansible_ssh_pass: "00000000"
          # ansible_become_password: "00000000"