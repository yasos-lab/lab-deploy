---

stages:
  - zsh
  - tools

debian_setup_zsh:
  stage: zsh
  image: ubuntu:20.04
  before_script:
    - echo Installing zsh on Debian
    - apt update && apt install -y git zsh
  script:
    - echo Setup zsh
    - bash setup-zsh.sh

rhel_setup_zsh:
  stage: zsh
  image: fedora:38
  before_script:
    - echo Installing zsh on RHEL
    - yum install -y git which util-linux-user zsh
  script:
    - echo Setup zsh
    - bash setup-zsh.sh

debian_setup_tools:
  stage: tools
  image: ubuntu:20.04
  before_script:
    - echo Configure tzdata
    - echo "tzdata tzdata/Areas select Europe" | debconf-set-selections
    - echo "tzdata tzdata/Zones/America select Paris" | debconf-set-selections
    - DEBIAN_FRONTEND=noninteractive apt update
    - DEBIAN_FRONTEND=noninteractive apt install -y tzdata
  script:
    - echo Installing packages on Debian
    - bash install-tools.sh
    - echo Setup Docker on Debian
    - bash install-tools.sh

rhel_setup_tools:
  stage: tools
  image: fedora:38
  script:
    - echo Installing packages on RHEL
    - bash install-tools.sh