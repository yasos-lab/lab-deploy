---

all:
  hosts:
    # Your laptop acts both as controller and target
    ubuntu_laptop:
      ansible_host: localhost  # This refers to your own machine
      ansible_user: "{{ lookup('env', 'USER') }}"
    debian_server:
      ansible_host: 192.168.1.73  # Replace with your Linux server's IP
      ansible_user: "{{ lookup('env', 'USER') }}"

  children:
    linux:
      hosts:
        ubuntu_laptop:
        debian_server:
    laptops:
      hosts:
        ubuntu_laptop:
    servers:
      hosts:
        debian_server: