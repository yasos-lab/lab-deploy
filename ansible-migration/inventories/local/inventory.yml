---

all:
  hosts:
    # Your laptop acts both as controller and target
    laptop:
      ansible_host: localhost  # This refers to your own machine
      ansible_user: "{{ lookup('env', 'USER') }}"
      ansible_become_password: "{{ lookup('env', 'PASSWORD') }}"
    server:
      ansible_host: 192.168.122.121  # Replace with your Linux server's IP
      ansible_user: "{{ lookup('env', 'USER') }}"
      ansible_become_password: "{{ lookup('env', 'SERVER_PASSWORD') }}"

  children:
    linux:
      hosts:
        laptop:
        server:
    laptops:
      hosts:
        laptop:
    servers:
      hosts:
        server: