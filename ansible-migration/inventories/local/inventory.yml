---

all:
  hosts:
    # Your laptop acts both as controller and target
    laptop:
      ansible_host: localhost  # This refers to your own machine

  children:
    linux_machines:
      hosts:
        laptop:
        linux_server:
          ansible_host: 192.168.1.10  # Replace with your Linux server's IP

    windows_machines:
      hosts:
        windows_machine:
          ansible_host: 192.168.1.11  # Replace with your Windows machine's IP
          ansible_user: Administrator  # For Windows, specify user
          ansible_password: "your_password"
          ansible_connection: winrm
          ansible_winrm_transport: ntlm
          ansible_winrm_server_cert_validation: ignore

    truenas_machines:
      hosts:
        truenas:
          ansible_host: 192.168.1.12  # Replace with your TrueNAS machine's IP
          ansible_user: root

