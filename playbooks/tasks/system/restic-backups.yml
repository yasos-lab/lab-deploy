---

- name: Ensure restic is installed
  ansible.builtin.package:
    name: restic
    state: present

- name: Ensure backup directories exists
  ansible.builtin.file:
    path: "{{ item.local_backup_repo }}"
    state: directory
    mode: '0755'
  loop: "{{ restic_backup_configs }}"

- name: Initialize Restic local Repository
  environment:
    RESTIC_PASSWORD: "{{ restic_password }}"
  ansible.builtin.command: 
    cmd: restic init --repo {{ item.local_backup_repo }}
    creates: "{{ item.local_backup_repo }}/config"
  loop: "{{ restic_backup_configs }}"

