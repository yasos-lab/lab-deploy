---

- name: Purge GPG keys and repositories
  block:
    - name: Remove GPG keys
      ansible.builtin.file:
        name: "/etc/apt/trusted.gpg.d/{{ item.name }}.asc"
        state: absent
      loop: "{{ repositories }}"

    - name: Remove repositories sources list files
      ansible.builtin.file:
        name: "/etc/apt/sources.list.d/{{ item.name }}-archive"
        state: absent
      loop: "{{ repositories }}"
      notify: update_apt_cache
  when: purge_vars.repositories
  tags: purge::repositories

- name: Add GPG keys and repositories
  block:
    - name: Add GPG keys
      ansible.builtin.get_url:
        url: "{{ item.gpg_url }}"
        dest: "/etc/apt/trusted.gpg.d/{{ item.name }}.{{ item.gpg_extention }}"
      loop: "{{ repositories }}"

    - name: Add APT repositories
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/trusted.gpg.d/{{ item.name }}.{{ item.gpg_extention }}] {{ item.repo_url }} {{ item.components | join(' ') }}"
        filename: "{{ item.name }}-archive"
        state: present
      loop: "{{ repositories }}"
      notify: update_apt_cache
    
  tags: add::repositories
