---

- name: Deploy workstation
  hosts: workstations
  become: yes
  vars:
    directories: "{{ common_directories + workstation_directories }}"
    directories_to_remove: "{{ common_directories_to_remove + workstation_directories_to_remove }}"
    packages: "{{ common_packages + workstation_packages }}"
    packages_to_purge: "{{ workstation_packages }}"
    python_packages: "{{ common_python_packages + workstation_python_packages }}"
    repositories: "{{ common_repositories + workstation_repositories }}"
    systemd_services: "{{ common_systemd_services + workstation_systemd_services }}"
    docker_networks: "{{ common_docker_networks + workstation_docker_networks }}"
    docker_services: "{{ common_docker_services + workstation_docker_services }}"
  tasks:
    - name: Purge
      ansible.builtin.import_tasks: tasks/purge.yml
      when: purge_all
      tags: workstation::purge

    - name: Deploy
      block:
        - name: Import directories tasks
          ansible.builtin.import_tasks: tasks/system/directories.yml
          tags: workstation::directories
        
        - name: Import repositories tasks
          ansible.builtin.import_tasks: tasks/system/repositories.yml
          tags: workstation::repositories
        
        - name: Import packages tasks
          ansible.builtin.import_tasks: tasks/system/packages.yml
          tags: workstation::packages
        
        - name: Import shell tasks
          ansible.builtin.import_tasks: tasks/system/shell.yml
          tags: workstation::shell
        
        - name: Import docker tasks
          ansible.builtin.import_tasks: tasks/docker/docker.yml
          tags: workstation::docker
        
        - name: Import docker services tasks
          ansible.builtin.import_tasks: tasks/docker/services.yml
          vars:
            postgresdb: "{{ lookup('community.general.bitwarden', 'postgres_service', field='database') | first }}"
            postgresdb_user: "{{ lookup('community.general.bitwarden', 'postgres_service', field='dbuser') | first }}"
            postgresdb_password: "{{ lookup('community.general.bitwarden', 'postgres_service', field='dbpassword') | first }}"
            nextclouddb: "{{ lookup('community.general.bitwarden', 'nextcloud_service', field='database') | first }}"
            nextclouddb_user: "{{ lookup('community.general.bitwarden', 'nextcloud_service', field='dbuser') | first }}"
            nextclouddb_password: "{{ lookup('community.general.bitwarden', 'nextcloud_service', field='dbpassword') | first }}"
            immichdb: "{{ lookup('community.general.bitwarden', 'immich_service', field='database') | first }}"
            immichdb_user: "{{ lookup('community.general.bitwarden', 'immich_service', field='dbuser') | first }}"
            immichdb_password: "{{ lookup('community.general.bitwarden', 'immich_service', field='dbpassword') | first }}"
            databases: "{{ workstation_databases }}"
          tags: workstation::docker::services

        - name: Import systemd services tasks
          ansible.builtin.import_tasks: tasks/system/services.yml
          tags: workstation::services
