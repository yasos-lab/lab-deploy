---

- name: Purge docker
  hosts: all
  become: yes
  pre_tasks:
    - name: Skip play if purge is disabled
      ansible.builtin.meta: end_play
      when: not purge_vars.docker
  tasks:
    - name: Purge docker
      ansible.builtin.package:
        name: "{{ item }}"
        state: latest
      loop: "{{ docker_packages }}"
  tags: purge::docker

- name: Install and setup docker
  hosts: all
  become: yes
  tasks:
    - name: Install docker packages
      ansible.builtin.package:
        name: "{{ item }}"
        state: latest
      loop: "{{ docker_packages }}"
    
    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes
    
    - name: Create docker group if not exists
      ansible.builtin.group:
        name: docker
        state: present
  
    - name: Add users to the docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
  tags: setup::docker