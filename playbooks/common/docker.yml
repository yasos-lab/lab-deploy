---

- name: Purge docker
  hosts: all
  become: yes
  pre_tasks:
    - name: Skip play if purge is disabled
      ansible.builtin.meta: end_play
      when: purge_vars.docker is false
  tasks:
    - name: Purge docker
      ansible.builtin.package:
        name: "{{ item }}"
        state: latest
      loop: "{{ docker_packages }}"
  tags: purge::docker

- name: Install and setup docker
  hosts: all
  become: yes
  tasks:
    - name: Install docker packages
      ansible.builtin.package:
        name: "{{ item }}"
        state: latest
      loop: "{{ docker_packages }}"
    
    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes
    
    - name: Create docker group if not exists
      ansible.builtin.group:
        name: docker
        state: present
  
    - name: Add users to the docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
  tags: setup::docker

- name: Create and run containers
  hosts: laptop
  tasks:
    - name: Create docker volumes
      community.docker.docker_volume:
        name: "{{ item.value }}"
        state: present
      loop: "{{ docker_volumes | dict2items }}"
    
    - name: Create docker networks
      community.docker.docker_network:
        name: "{{ item.value }}"
        state: present
      loop: "{{ docker_networks | dict2items }}"