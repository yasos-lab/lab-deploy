---

- name: "Update package cache"
  ansible.builtin.package:
    update_cache: true

- name: "Systemd daemon-reload"
  ansible.builtin.systemd:
    daemon_reload: true

- name: "Restart docker daemon"
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true

- name: "Restart unbound service"
  ansible.builtin.service:
    name: unbound
    enabled: true
    state: restarted
