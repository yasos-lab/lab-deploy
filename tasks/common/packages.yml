---

- name: Install system packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: latest
    update_cache: true
  loop: "{{ packages | default([]) }}"
  register: install_result
  retries: 5
  delay: 10
  until: install_result is succeeded

- name: Install deb packages from url
  ansible.builtin.apt:
    deb: "{{ item }}"
  loop: "{{ deb_packages | default([]) }}"

- name: Install python packages
  block:
    - name: Create pipx home
      ansible.builtin.file:
        name: "/opt/pipx"
        state: directory
    - name: Persist pipx env for all sessions
      ansible.builtin.copy:
        dest: /etc/environment
        mode: "0644"
        content: |
          PIPX_HOME=/opt/pipx
          PIPX_BIN_DIR=/usr/local/bin
    - name: Install pipx package
      community.general.pipx:
        name: "{{ item }}"
      loop: "{{ python_packages | default([]) }}"