---

- name: Purge repositories
  block:
    - name: Remove GPG keys
      ansible.builtin.file:
        name: "/etc/apt/trusted.gpg.d/{{ item.name }}.asc"
        state: absent
      loop: "{{ repositories }}"

    - name: Remove repositories sources list files
      ansible.builtin.file:
        name: "/etc/apt/sources.list.d/{{ item.name }}-archive"
        state: absent
      loop: "{{ repositories }}"
      notify: update_apt_cache

  when: purge_vars.repositories

- name: Purge packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: absent
  loop: "{{ packages_to_purge }}"   
  when: purge_vars.packages

- name: Purge shell
  block:
    - name: Remove zsh themes and plugins
      ansible.builtin.file:
        name: "{{ zsh_directory }}"
        state: absent

    - name: Remove config files
      ansible.builtin.file:
        name: "{{ item.dest_path }}/{{ item.file }}"
        state: absent
      loop: "{{ config_files }}"

    - name: Purge zsh packages
      ansible.builtin.package:
        name: zsh
        state: absent

    - name: Change the default shell to Bash
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        shell: /bin/bash
  when: purge_vars.shell

- name: Purge docker
  ansible.builtin.package:
    name: "{{ item }}"
    state: latest
  loop: "{{ docker_packages }}"
  when: purge_vars.docker

- name: Purge systemd services
  block:
    - name: Stop services
      ansible.builtin.service:
        name: "{{ item.name }}"
        state: stopped
      loop: "{{ systemd_services }}"

    - name: Remove services files
      ansible.builtin.file:
        name: "/etc/systemd/system/{{ item.name }}.service"
        state: absent
      loop: "{{ systemd_services }}"
  when: purge_vars.services