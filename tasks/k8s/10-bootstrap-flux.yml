---
- name: Bootstrap Flux
  when: inventory_hostname == groups['k8s_controlplanes'][0]
  block:
    - name: Check if Flux CLI is installed
      ansible.builtin.command: which flux
      register: flux_installed
      changed_when: false
      failed_when: false

    - name: Download and install Flux CLI
      when: flux_installed.rc != 0
      block:
        - name: Download Flux install script
          ansible.builtin.get_url:
            url: https://fluxcd.io/install.sh
            dest: /tmp/install-flux.sh
            mode: '0755'

        - name: Install Flux CLI
          ansible.builtin.command: /tmp/install-flux.sh
          environment:
            FLUX_VERSION: "{{ flux_version | default('latest') }}"
          register: flux_install_result
          changed_when: "'installed' in flux_install_result.stdout"

        - name: Remove install script
          ansible.builtin.file:
            path: /tmp/install-flux.sh
            state: absent

    - name: Bootstrap Flux into the cluster
      ansible.builtin.command:
        cmd: >
          flux bootstrap git
          --url={{ flux_git_url }}
          --branch={{ flux_git_branch }}
          --token-auth
          --password={{ flux_git_token }}
          --path={{ flux_git_path }}
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: flux_bootstrap
      changed_when: "'already installed' not in flux_bootstrap.stdout"
