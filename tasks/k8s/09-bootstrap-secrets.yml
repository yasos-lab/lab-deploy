---
- name: Bootstrap Kubernetes Secrets
  when: inventory_hostname == groups['k8s_controlplanes'][0]
  block:
    - name: Ensure target namespaces exist
      ansible.builtin.command:
        cmd: kubectl create namespace {{ item }} --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      loop: "{{ k8s_secrets | map(attribute='namespace') | unique | list }}"
      changed_when: false

    - name: Create Opaque secrets
      ansible.builtin.shell:
        cmd: |
          kubectl create secret generic {{ item.name }} \
            {% for key, value in item.data.items() -%}
            --from-literal={{ key }}={{ value }} \
            {% endfor -%}
            --namespace {{ item.namespace }} \
            --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      loop: "{{ k8s_secrets | selectattr('type', 'equalto', 'Opaque') | list }}"
      changed_when: false

    - name: Create docker-registry secrets
      ansible.builtin.shell:
        cmd: >
          kubectl create secret docker-registry {{ item.name }}
          --docker-server={{ item.data.registry }}
          --docker-username={{ item.data.username }}
          --docker-password={{ item.data.password }}
          {% if item.data.email is defined %}--docker-email={{ item.data.email }}{% endif %}
          --namespace {{ item.namespace }}
          --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      loop: "{{ k8s_secrets | selectattr('type', 'equalto', 'docker-registry') | list }}"
      changed_when: false

    - name: Create TLS secrets from files
      ansible.builtin.shell:
        cmd: >
          kubectl create secret tls {{ item.name }}
          --cert={{ item.data.cert_file }}
          --key={{ item.data.key_file }}
          --namespace {{ item.namespace }}
          --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      loop: "{{ k8s_secrets | selectattr('type', 'equalto', 'kubernetes.io/tls') | list }}"
      changed_when: false
