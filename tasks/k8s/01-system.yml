---

- name: Disable swap
  ansible.builtin.shell: |
    swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Load required kernel modules for Kubernetes
  block:
    - name: Ensure kernel modules are loaded now
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: "{{ k8s_required_kernel_modules }}"

    - name: Persist kernel modules across reboots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          {% for mod in k8s_required_kernel_modules %}
          {{ mod }}
          {% endfor %}
        owner: root
        group: root
        mode: "0644"

    - name: Set required sysctl parameters
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: true
        state: present
      loop:
        - { key: net.bridge.bridge-nf-call-iptables,  value: "1" }
        - { key: net.bridge.bridge-nf-call-ip6tables, value: "1" }
        - { key: net.ipv4.ip_forward,                 value: "1" }

- name: Add all nodes hostnames to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED BLOCK - K8S NODES"
    block: |
      {% for host in groups['k8s'] %}
      {{ hostvars[host]['ansible_host'] }} {{ host }}
      {% endfor %}
      {{ lan_prefix }}.50 k8s-vip