---

- name: Create systemd services files
  ansible.builtin.template:
    src: ../../templates/systemd_service.j2
    dest: "/etc/systemd/system/{{ service.name }}.service"
  loop: "{{ systemd_services }}"
  loop_control:
    loop_var: service

- name: Enable and start services
  ansible.builtin.systemd:
    name: "{{ item.name }}"
    daemon_reload: true
    enabled: true
    state: restarted
  loop: "{{ systemd_services }}"
